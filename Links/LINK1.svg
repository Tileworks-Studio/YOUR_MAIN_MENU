<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="500" height="500" fill="#FF6B1D"/>
  
  <!-- Outer Brushstroke Ring -->
  <g transform="translate(250, 250) scale(1.35)">
    <!-- Main Brush Ring Body -->
    <path d="M -20 -130 
             C 45 -140 115 -90 135 -20 
             C 155 50 140 120 85 150 
             C 20 185 -70 170 -125 120 
             C -175 75 -165 -15 -130 -70 
             C -100 -115 -55 -135 -20 -130 
             Z
             M -10 -110 
             C -45 -110 -95 -80 -110 -35 
             C -130 20 -110 90 -60 125 
             C -10 160 65 155 105 120 
             C 145 80 140 20 115 -35 
             C 90 -90 35 -110 -10 -110 
             Z" 
          fill="#BAA0E6"/>

    <!-- Brushstroke Outer Taper & Texture Strands -->
    <path d="M -115 -65 C -75 -125 15 -145 85 -130 C 120 -122 145 -100 152 -85" fill="none" stroke="#BAA0E6" stroke-width="5" stroke-linecap="round"/>
    <path d="M -90 -100 C -40 -140 40 -152 110 -125" fill="none" stroke="#BAA0E6" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M -135 -35 C -142 -85 -95 -135 -25 -150" fill="none" stroke="#BAA0E6" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -145 0 C -155 -50 -125 -110 -60 -142" fill="none" stroke="#BAA0E6" stroke-width="2" stroke-linecap="round"/>
    <path d="M 60 140 C 0 172 -80 162 -130 110" fill="none" stroke="#BAA0E6" stroke-width="4" stroke-linecap="round"/>
    <path d="M -40 152 C -95 145 -138 105 -150 60" fill="none" stroke="#BAA0E6" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Centered Button Text -->
  <text x="250" y="268" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="68" 
        fill="#000000" 
        text-anchor="middle" 
        letter-spacing="2">BUTTON</text>
</svg>
